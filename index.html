<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>fzmobile Technologies — Project Brief</title>

<style>
/* KEEP YOUR ORIGINAL CSS — unchanged */
</style>
</head>

<body>

<form action="https://formspree.io/f/mgopejqj" method="POST">

<!-- hidden config -->
<input type="hidden" name="_subject" value="New Project Brief Submission">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="success.html">
<input type="hidden" name="submitted_at" id="timestamp">

<!-- NAV -->
<nav>
  <div class="nav-brand">Fzmobile<span> Technologies</span></div>
  <div class="nav-tag">Web · SEO · Digital Growth</div>
</nav>

<div class="hero">
  <div class="hero-pill">Project Brief</div>
  <h1>Let's Build Your<span>Digital Presence</span></h1>
</div>

<main>

<!-- PACKAGE -->
<input type="radio" name="package" value="starter" required>
<input type="radio" name="package" value="growth">
<input type="radio" name="package" value="premium">
<input type="radio" name="package" value="unsure">

<!-- BUSINESS -->
<input type="text" name="business_name" placeholder="Business Name" required>
<input type="text" name="business_location" placeholder="Location">

<!-- INSURANCE -->
<input type="checkbox" name="insurance[]" value="health">
<input type="checkbox" name="insurance[]" value="auto">
<input type="checkbox" name="insurance[]" value="life">

<!-- CONTACT -->
<input type="text" name="first_name">
<input type="text" name="last_name">
<input type="email" name="email">
<input type="tel" name="phone">

<!-- NOTES -->
<textarea name="notes" placeholder="Additional details"></textarea>

<!-- SUBMIT -->
<button type="submit">Submit Project Brief</button>

</main>
</form>

<script>
// timestamp
document.getElementById('timestamp').value = new Date().toISOString();
</script>

</body>
</html>
